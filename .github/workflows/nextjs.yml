# Sample workflow for building and deploying a Next.js site to GitHub Pages
#
# To get started with Next.js see: https://nextjs.org/docs/getting-started
#
name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: oven-sh/setup-bun@v2

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Restore cache
        uses: actions/cache@v5
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock', 'next.config.mjs', 'tsconfig.json') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Get image source hash
        id: image-hash
        run: |
          HASH="${{ hashFiles(
            'public/images/**/*.png',
            'public/images/**/*.jpg',
            'public/images/**/*.jpeg',
            'public/images/**/*.gif',
            'public/images/**/*.svg',
            'public/images/**/*.webp',

            'content/wiki/**/*.png',
            'content/wiki/**/*.jpg',
            'content/wiki/**/*.jpeg',
            'content/wiki/**/*.gif',
            'content/wiki/**/*.svg',
            'content/wiki/**/*.webp'
          ) }}"
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Cache optimized images
        uses: actions/cache@v5
        with:
          path: public/assets/.cache
          key: ${{ runner.os }}-imageopt-${{ hashFiles('bun.lock') }}-${{ steps.image-hash.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-imageopt-${{ hashFiles('bun.lock') }}-

      - name: Install dependencies
        run: bun ci

      - name: Build with Next.js
        run: bun run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
