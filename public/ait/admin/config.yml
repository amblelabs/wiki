logo_url: https://amblelabs.dev/wiki/logo.png
app_title: AIT Wiki Admin
site_url: https://amblelabs.dev/wiki/

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

# ================================
# Backend Configuration
# ================================
backend:
  name: github
  repo: amblelabs/wiki
  branch: main
  base_url: https://sveltia-cms-auth.drtheo.workers.dev/

media_libraries:
  default:
    config:
      slugify_filename: true

i18n:
  structure: multiple_files
  locales: [en, ru, fr, uk, es, cn]
  initial_locales: default
  omit_default_locale_from_file_path: true

# ================================
# Global Media Settings (Overridden per collection)
# ================================
media_folder: "public/images"
public_folder: "/images"

# ================================
# Collections
# ================================
# ================================
# Collections
# ================================
collections:
  # -------------------------------------------------
  # 1. CATEGORY MAIN PAGES (creates index.md/json)
  # -------------------------------------------------
  - name: wiki_categories
    label: "📁 Category Pages"
    label_singular: "📁 Category Index"
    folder: content/wiki
    format: json
    create: true
    path: "{{wiki}}/{{section}}/meta"

    i18n: true

    summary: "📂 {{wiki}} / {{section}} ({{title}})"

    view_groups:
      groups:
        - name: wiki
          label: Wiki
          field: wiki
      default: wiki

    fields:
      - label: "Target Wiki"
        name: "wiki"
        widget: "select"
        options: ["ait", "k9"]
        default: "ait"
        hint: "Select which wiki this category belongs to."

      - label: "Title"
        name: "title"
        widget: "string"
        i18n: true

      - label: "Section (Folder)"
        name: "section"
        widget: "string"
        hint: "Enter folder name (e.g., getting-started). This creates or selects the folder."
        pattern:
          ["^[a-z0-9-]+$", "Use lowercase letters, numbers, and hyphens only."]

  # -------------------------------------------------
  # 2. REGULAR WIKI PAGES (creates slug.mdx)
  # -------------------------------------------------
  - name: wiki_pages
    label: "📄 Wiki Pages"
    label_singular: "📄 Wiki Page"
    # 👇 Changed to root wiki folder
    folder: content/wiki
    extension: mdx
    create: true
    # 👇 Dynamically builds path based on selected wiki
    path: "{{wiki}}/{{section}}/{{slug}}"

    media_folder: ""
    public_folder: "{{slug}}"

    i18n: true

    summary: "📄 [{{wiki}}] {{section}}/{{title}}"

    view_groups:
      groups:
        - name: wiki
          label: Wiki
          field: wiki
        - name: section
          label: Categories
          field: section
      # Groups by Wiki first, making it easy to manage multiple wikis
      default: wiki

    fields:
      # 👇 New field to route the page to the correct wiki folder
      - label: "Target Wiki"
        name: "wiki"
        widget: "select"
        options: ["ait", "k9"]
        default: "ait"

      - label: "Title"
        name: "title"
        widget: "string"
        i18n: true

      - label: "Description"
        name: "description"
        widget: "text"
        required: false
        i18n: true

      - name: "section"
        widget: "relation"
        collection: "wiki_categories"
        value_field: "{{fields.section}}"
        search_fields: ["title", "fields.section", "wiki"]
        # 👇 Displays the Wiki name next to the category in the dropdown so you don't mix them up
        display_fields: ["wiki", "title"]
        multiple: false
        i18n: "duplicate"
        dropdown_threshold: 0

      - label: "Body"
        name: "body"
        widget: "markdown"
        i18n: true