logo_url: https://amblelabs.dev/wiki/logo.png
app_title: AIT Wiki Admin
site_url: https://amblelabs.dev/wiki/

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

# ================================
# Backend Configuration
# ================================
backend:
  name: github
  repo: amblelabs/wiki
  branch: main
  base_url: https://sveltia-cms-auth.drtheo.workers.dev/

media_libraries:
  default:
    config:
      slugify_filename: true

i18n:
  structure: multiple_files
  locales: [en, ru, fr, uk, es, cn]
  initial_locales: default
  omit_default_locale_from_file_path: true

# ================================
# Global Media Settings (Overridden per collection)
# ================================
media_folder: "public/images"
public_folder: "/images"

# ================================
# Collections
# ================================
collections:
  # -------------------------------------------------
  # 1. CATEGORY MAIN PAGES (Dynamic Wiki Type)
  # -------------------------------------------------
  - name: wiki_categories
    label: "📁 Category Pages"
    label_singular: "📁 Category Index"
    folder: content/wiki                  # 👈 Moved up to the root wiki folder
    format: json
    create: true
    path: "{{wiki_type}}/{{section}}/meta" # 👈 Dynamically places it in ait/ or k9/

    i18n: true
    summary: "📂 [{{wiki_type}}] {{section}} ({{title}})"

    view_groups:
      groups:
        - name: wiki_type
          label: Wiki Project
          field: wiki_type
      default: wiki_type

    fields:
      - label: "Wiki Project"               # 👈 New field to select the root wiki
        name: "wiki_type"
        widget: "select"
        options: ["ait", "k9"]
        i18n: "duplicate"

      - label: "Title"
        name: "title"
        widget: "string"
        i18n: true

      - label: "Section (Folder)"
        name: "section"
        widget: "string"
        hint: "Enter folder name (e.g., getting-started, tutorials, api)."
        pattern: ["^[a-z0-9-]+$", "Use lowercase letters, numbers, and hyphens only."]

  # -------------------------------------------------
  # 2. REGULAR WIKI PAGES (Dynamic Wiki Type)
  # -------------------------------------------------
  - name: wiki_pages
    label: "📄 Wiki Pages"
    label_singular: "📄 Wiki Page"
    folder: content/wiki                  # 👈 Moved up to the root wiki folder
    extension: mdx
    create: true
    path: "{{wiki_type}}/{{section}}/{{slug}}" # 👈 Dynamically routes file path

    media_folder: ""
    public_folder: "{{slug}}"
    i18n: true
    summary: "📄 [{{wiki_type}}] {{section}}/{{title}}"

    view_groups:
      groups:
        - name: wiki_type
          label: Wiki Project
          field: wiki_type
        - name: section
          label: Categories
          field: section

    fields:
      - label: "Wiki Project"               # 👈 New field to select the root wiki
        name: "wiki_type"
        widget: "select"
        options: ["ait", "k9"]
        i18n: "duplicate"

      - label: "Title"
        name: "title"
        widget: "string"
        i18n: true

      - label: "Description"
        name: "description"
        widget: "text"
        required: false
        i18n: true

      - name: "section"
        widget: "relation"
        collection: "wiki_categories"
        value_field: "{{fields.section}}"
        search_fields: ["title", "fields.section"]
        display_fields: ["title"]
        multiple: false
        i18n: "duplicate"
        dropdown_threshold: 0

      - label: "Body"
        name: "body"
        widget: "markdown"
        i18n: true
